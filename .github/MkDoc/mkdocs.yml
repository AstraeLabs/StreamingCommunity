site_name: VibraVid
site_description: DRM HLS/DASH downloader documentation
repo_name: VibraVid
docs_dir: docs
site_dir: ../../site

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            group_by_category: true

nav:
  - Home: index.md
  - API Reference: reference/
