{% if variant == "floating" %}
<button
	type="button"
	onclick="window.history.back()"
	aria-label="Torna indietro"
	class="absolute top-20 left-4 sm:left-6 lg:left-10 p-2.5 sm:p-3 bg-scrim/60 hover:bg-scrim/80 backdrop-blur-sm rounded-full transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500/60"
>
	<svg class="w-5 h-5 sm:w-6 sm:h-6 text-fg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
		<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
	</svg>
</button>
{% else %}
<button
	type="button"
	onclick="window.history.back()"
	aria-label="Torna indietro"
	class="p-2 rounded-lg transition-colors hover:bg-overlay/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500/60"
>
	<svg class="w-6 h-6 text-fg-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
		<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
	</svg>
</button>
{% endif %}
