
<div class="panel-flat px-4 py-3">
	<p class="text-[10px] font-bold uppercase tracking-widest text-fg-muted">{{ label }}</p>
	<p class="mt-1 text-2xl font-black tabular-nums
		{% if tone == 'ok' %}text-green-400
		{% elif tone == 'warn' %}text-yellow-400
		{% elif tone == 'err' %}text-red-400
		{% elif tone == 'info' %}text-blue-400
		{% else %}text-fg{% endif %}">{{ value }}</p>
</div>
